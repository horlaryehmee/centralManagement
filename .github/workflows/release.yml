# Builds a ready-to-upload package of the central update server.
#
#   1. Put the version in VERSION and commit.  2. git tag v1.0.0 && git push origin v1.0.0
#
# The GitHub release gets central-v1.0.0.zip (Composer packages and compiled assets
# included) for NEW installs: upload it, extract, open the address and follow the setup
# wizard. Existing installs update straight from the repository instead (Updates in the
# menu → Update now), no zip or tag needed.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($FILE)."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, sodium, pdo_mysql, mbstring, intl
          tools: composer:v2

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build assets
        run: |
          npm ci --include=dev
          npm run build

      - name: Create package
        run: |
          NAME="central-${GITHUB_REF_NAME}.zip"
          rm -f bootstrap/cache/*.php
          zip -rq "$NAME" . \
            -x '.git/*' '.github/*' 'node_modules/*' 'tests/*' '.env' '.env.backup' \
               'storage/logs/*.log' 'storage/framework/cache/data/*' 'storage/framework/sessions/*' \
               'storage/framework/views/*.php' 'storage/app/private/*' 'storage/app/installed.json' \
               'database/database.sqlite' '*.zip'
          sha256sum "$NAME" > "$NAME.sha256"
          echo "PACKAGE=$NAME" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PACKAGE }}
            ${{ env.PACKAGE }}.sha256
          generate_release_notes: true
